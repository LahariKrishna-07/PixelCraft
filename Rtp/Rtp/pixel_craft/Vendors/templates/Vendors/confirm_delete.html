{% extends 'Vendors_base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 text-center">
        <div class="p-5 rounded-4 border border-danger" style="background: rgba(220, 53, 69, 0.05);">
            <i class="bi bi-exclamation-octagon text-danger display-1 mb-4"></i>
            <h2 class="text-white fw-bold">Are you sure?</h2>
            <p class="text-muted">You are about to remove <strong>{{ item.component.name }}</strong> from your store. This cannot be undone.</p>
            
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-lg w-100 mb-3">Yes, Delete Listing</button>
                <a href="{% url 'vendor_inventory' %}" class="btn btn-outline-secondary w-100">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
