{% extends 'Vendors_base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-lg-6">
        <div class="card bg-dark text-white border-secondary shadow-lg p-4" style="border-radius: 20px; background: rgba(255,255,255,0.03) !important; backdrop-filter: blur(10px);">
            
            <div class="text-center mb-4">
                <img src="{{ item.component.image.url }}" style="height: 120px; object-fit: contain;" class="mb-3">
                <h3 class="fw-bold">Edit Listing: {{ item.component.name }}</h3>
                <p class="text-muted small">{{ item.component.brand }} | {{ item.component.category }}</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-info small">Selling Price ($)</label>
                    {{ form.price }}
                </div>
                <div class="mb-3">
                    <label class="form-label text-info small">Stock Quantity</label>
                    {{ form.stock_quantity }}
                </div>
                <div class="mb-4 d-flex align-items-center">
                    {{ form.is_active }}
                    <label class="ms-2 mb-0">Active Listing</label>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary py-2 fw-bold">Save Changes</button>
                    <a href="{% url 'delete_inventory_item' item.id %}" class="btn btn-outline-danger py-2">
                        <i class="bi bi-trash me-2"></i>Remove from Shop
                    </a>
                    <a href="{% url 'vendor_inventory' %}" class="btn btn-link text-muted">Back to Inventory</a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    input { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
</style>
{% endblock %}
